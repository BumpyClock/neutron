[package]
name = "neutron-components-conformance"
description = "Native AppShell conformance executable."
version = "0.7.0"
rust-version = "1.95.0"
publish = false
edition.workspace = true

[package.metadata.gpui-app]
app_id = "com.neutron-components.conformance"
display_name = "Neutron Components Conformance"
categories = ["Development"]

[features]
wayland-conformance = ["neutron-components-app/wayland-conformance"]

[dependencies]
anyhow.workspace = true
gpui = { workspace = true, features = ["test-support"] }
neutron-components.workspace = true
neutron-components-app.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
neutron-components-manifest.workspace = true

[lints]
workspace = true
