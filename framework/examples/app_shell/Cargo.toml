[package]
name = "app_shell"
description = "Conformance example for the AppShell platform."
version = "0.7.0"
rust-version = "1.95.0"
publish = false
edition.workspace = true

[package.metadata.gpui-app]
app_id = "com.neutron-components.app-shell-example"
display_name = "App Shell Example"
categories = ["Development"]

[dependencies]
anyhow.workspace = true
neutron-components-app.workspace = true
neutron-components-assets.workspace = true
log.workspace = true
serde.workspace = true

# Only a build dependency: `build.rs` calls `emit_identity()`. The runtime
# `include_identity!()` (re-exported by neutron-components-app) resolves the manifest
# schema types via macro `$crate`, so no runtime dependency is needed here.
[build-dependencies]
neutron-components-manifest.workspace = true

[lints]
workspace = true
