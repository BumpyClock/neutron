[package]
name = "neutron-components-app"
description = "Application shell for neutron-components apps: the AppDeclaration model, lifecycle events, identity, settings, windows, theme, menus."
version = "0.7.0"
edition.workspace = true
publish = false
rust-version = "1.95.0"
license.workspace = true
repository = "https://github.com/BumpyClock/neutron"

[features]
# Internal fixture; enable it explicitly for the harness-free headless test.
test-support = []
# Conformance-only Weston input seam; never enable in publishable application builds.
wayland-conformance = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
neutron-components.workspace = true
neutron-components-assets.workspace = true
neutron-components-manifest.workspace = true
neutron-components-storage.workspace = true
log.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

# EnvironmentPolicy::LoginShell's PATH repair. macOS/Linux only: Windows GUI
# processes inherit PATH from the launching context, so the policy is a
# documented no-op there and the crate is not pulled in.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
fix-path-env.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
wait-timeout.workspace = true

# GPUI must construct its `App` on the main thread, which cargo's default test
# harness (worker threads) cannot provide. This test drives the shell from its
# own `main`, on the process main thread. Run it with `--features test-support`.
[[test]]
name = "headless"
harness = false
required-features = ["test-support"]

[lints]
workspace = true
