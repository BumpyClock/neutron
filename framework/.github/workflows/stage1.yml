name: Stage 1 runtime evidence

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_BACKTRACE: "1"

jobs:
  stage1-lifecycle-headless-macos:
    name: stage1-lifecycle-headless-macos
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Prepare evidence directory
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          mkdir -p "$artifact_dir"
          {
            rustc -vV
            cargo -V
            rustup show active-toolchain
            uname -a
          } > "$artifact_dir/target-metadata.log"
      - name: Record exact source identity
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: record
      - name: Install system dependencies
        run: script/bootstrap
      - name: Run headless lifecycle integration
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          python3 tooling/stage1_watchdog.py \
            --timeout-seconds 600 \
            --stdout "$artifact_dir/headless.stdout.log" \
            --stderr "$artifact_dir/headless.stderr.log" \
            --log "$artifact_dir/headless.watchdog.log" \
            -- cargo test --locked -p gpui-component-app --test headless --features test-support
      - name: Verify exact source identity
        if: always()
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: verify
      - name: Upload Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage1-lifecycle-headless-macos
          path: ${{ runner.temp }}/stage1-${{ github.job }}
          if-no-files-found: warn

  stage1-lifecycle-headless-windows:
    name: stage1-lifecycle-headless-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Prepare evidence directory
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "stage1-${{ github.job }}"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          & rustc -vV | Set-Content (Join-Path $artifactDir "target-metadata.log")
          & cargo -V | Add-Content (Join-Path $artifactDir "target-metadata.log")
          & rustup show active-toolchain | Add-Content (Join-Path $artifactDir "target-metadata.log")
          [System.Environment]::OSVersion.VersionString | Add-Content (Join-Path $artifactDir "target-metadata.log")
      - name: Record exact source identity
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: record
      - name: Test bounded Windows Job Object supervision
        shell: pwsh
        run: python -m unittest tooling.test_stage1_process_integration
      - name: Run headless lifecycle integration
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "stage1-${{ github.job }}"
          & python tooling/stage1_watchdog.py `
            --timeout-seconds 600 `
            --stdout (Join-Path $artifactDir "headless.stdout.log") `
            --stderr (Join-Path $artifactDir "headless.stderr.log") `
            --log (Join-Path $artifactDir "headless.watchdog.log") `
            -- cargo test --locked -p gpui-component-app --test headless --features test-support
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Verify exact source identity
        if: always()
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: verify
      - name: Upload Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage1-lifecycle-headless-windows
          path: ${{ runner.temp }}/stage1-${{ github.job }}
          if-no-files-found: warn

  stage1-lifecycle-headless-linux:
    name: stage1-lifecycle-headless-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Prepare evidence directory
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          mkdir -p "$artifact_dir"
          {
            rustc -vV
            cargo -V
            rustup show active-toolchain
            uname -a
          } > "$artifact_dir/target-metadata.log"
      - name: Record exact source identity
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: record
      - name: Install system dependencies
        run: script/bootstrap
      - name: Run headless lifecycle integration
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          python3 tooling/stage1_watchdog.py \
            --timeout-seconds 600 \
            --stdout "$artifact_dir/headless.stdout.log" \
            --stderr "$artifact_dir/headless.stderr.log" \
            --log "$artifact_dir/headless.watchdog.log" \
            -- cargo test --locked -p gpui-component-app --test headless --features test-support
      - name: Verify exact source identity
        if: always()
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: verify
      - name: Upload Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage1-lifecycle-headless-linux
          path: ${{ runner.temp }}/stage1-${{ github.job }}
          if-no-files-found: warn

  stage1-native-macos-metal:
    name: stage1-native-macos-metal
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      GPUI_RENDERER: default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Prepare evidence directory
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          mkdir -p "$artifact_dir"
          {
            rustc -vV
            cargo -V
            rustup show active-toolchain
            uname -a
          } > "$artifact_dir/target-metadata.log"
      - name: Record exact source identity
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: record
      - name: Install system dependencies
        run: script/bootstrap
      - name: Run focused input and accessibility contracts
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          python3 tooling/stage1_watchdog.py \
            --timeout-seconds 600 \
            --stdout "$artifact_dir/focused-contracts.stdout.log" \
            --stderr "$artifact_dir/focused-contracts.stderr.log" \
            --log "$artifact_dir/focused-contracts.watchdog.log" \
            -- cargo test --locked -p gpui-component stage1_contract_
      - name: Build native conformance runner
        run: cargo build --locked -p gpui-component-conformance
      - name: Run and validate native scenarios
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          binary="target/debug/gpui-component-conformance"
          validation_profile="macos-metal"

          run_scenario() {
            local scenario="$1"
            local expected_exit_code="$2"
            python3 tooling/stage1_watchdog.py \
              --timeout-seconds 120 \
              --expected-exit-code "$expected_exit_code" \
              --stdout "$artifact_dir/$scenario.jsonl" \
              --stderr "$artifact_dir/$scenario.stderr.log" \
              --log "$artifact_dir/$scenario.watchdog.log" \
              -- "$binary" --scenario "$scenario"
            python3 tooling/stage1_watchdog.py \
              --timeout-seconds 30 \
              --stdin "$artifact_dir/$scenario.jsonl" \
              --stdout "$artifact_dir/$scenario.validation.stdout.log" \
              --stderr "$artifact_dir/$scenario.validation.stderr.log" \
              --log "$artifact_dir/$scenario.validation.watchdog.log" \
              -- "$binary" --validate "$scenario" --profile "$validation_profile"
          }

          run_scenario lifecycle-clean 0
          run_scenario lifecycle-startup-failure 2
          run_scenario lifecycle-background-quit 0
          run_scenario window-cycle 0
          run_scenario menu-command 0
          run_scenario interaction-contracts 0
          python3 tooling/stage1_clipboard_harness.py \
            --binary "$binary" \
            --timeout-seconds 120 \
            --stdout "$artifact_dir/clipboard.jsonl" \
            --stderr "$artifact_dir/clipboard.stderr.log" \
            --log "$artifact_dir/clipboard.watchdog.log" \
            --reader-stdout "$artifact_dir/clipboard.reader.stdout.log" \
            --reader-stderr "$artifact_dir/clipboard.reader.stderr.log" \
            --validation-stdout "$artifact_dir/clipboard.validation.stdout.log" \
            --validation-stderr "$artifact_dir/clipboard.validation.stderr.log" \
            --validation-log "$artifact_dir/clipboard.validation.watchdog.log" \
            --validation-profile "$validation_profile" \
            --reader-command pbpaste
      - name: Verify exact source identity
        if: always()
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: verify
      - name: Upload Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage1-native-macos-metal
          path: ${{ runner.temp }}/stage1-${{ github.job }}
          if-no-files-found: warn

  stage1-native-windows-warp:
    name: stage1-native-windows-warp
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GPUI_RENDERER: software
      GPUI_DISABLE_DIRECT_COMPOSITION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Prepare evidence directory
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "stage1-${{ github.job }}"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          & rustc -vV | Set-Content (Join-Path $artifactDir "target-metadata.log")
          & cargo -V | Add-Content (Join-Path $artifactDir "target-metadata.log")
          & rustup show active-toolchain | Add-Content (Join-Path $artifactDir "target-metadata.log")
          [System.Environment]::OSVersion.VersionString | Add-Content (Join-Path $artifactDir "target-metadata.log")
      - name: Record exact source identity
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: record
      - name: Run focused input and accessibility contracts
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "stage1-${{ github.job }}"
          & python tooling/stage1_watchdog.py `
            --timeout-seconds 600 `
            --stdout (Join-Path $artifactDir "focused-contracts.stdout.log") `
            --stderr (Join-Path $artifactDir "focused-contracts.stderr.log") `
            --log (Join-Path $artifactDir "focused-contracts.watchdog.log") `
            -- cargo test --locked -p gpui-component stage1_contract_
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Build native conformance runner
        run: cargo build --locked -p gpui-component-conformance
      - name: Run and validate native scenarios
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "stage1-${{ github.job }}"
          $binary = "target\debug\gpui-component-conformance.exe"
          $validationProfile = "windows-warp"

          function Invoke-ConformanceScenario([string]$Scenario, [int]$ExpectedExitCode) {
            & python tooling/stage1_watchdog.py `
              --timeout-seconds 120 `
              --expected-exit-code $ExpectedExitCode `
              --stdout (Join-Path $artifactDir "$Scenario.jsonl") `
              --stderr (Join-Path $artifactDir "$Scenario.stderr.log") `
              --log (Join-Path $artifactDir "$Scenario.watchdog.log") `
              -- $binary --scenario $Scenario
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            & python tooling/stage1_watchdog.py `
              --timeout-seconds 30 `
              --stdin (Join-Path $artifactDir "$Scenario.jsonl") `
              --stdout (Join-Path $artifactDir "$Scenario.validation.stdout.log") `
              --stderr (Join-Path $artifactDir "$Scenario.validation.stderr.log") `
              --log (Join-Path $artifactDir "$Scenario.validation.watchdog.log") `
              -- $binary --validate $Scenario --profile $validationProfile
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          Invoke-ConformanceScenario "lifecycle-clean" 0
          Invoke-ConformanceScenario "lifecycle-startup-failure" 2
          Invoke-ConformanceScenario "lifecycle-background-quit" 0
          Invoke-ConformanceScenario "window-cycle" 0
          Invoke-ConformanceScenario "menu-command" 0
          Invoke-ConformanceScenario "interaction-contracts" 0
          & python tooling/stage1_clipboard_harness.py `
            --binary $binary `
            --timeout-seconds 120 `
            --stdout (Join-Path $artifactDir "clipboard.jsonl") `
            --stderr (Join-Path $artifactDir "clipboard.stderr.log") `
            --log (Join-Path $artifactDir "clipboard.watchdog.log") `
            --reader-stdout (Join-Path $artifactDir "clipboard.reader.stdout.log") `
            --reader-stderr (Join-Path $artifactDir "clipboard.reader.stderr.log") `
            --validation-stdout (Join-Path $artifactDir "clipboard.validation.stdout.log") `
            --validation-stderr (Join-Path $artifactDir "clipboard.validation.stderr.log") `
            --validation-log (Join-Path $artifactDir "clipboard.validation.watchdog.log") `
            --validation-profile $validationProfile `
            --reader-command powershell.exe -NoProfile -NonInteractive -Command 'Get-Clipboard -Raw'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Verify exact source identity
        if: always()
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: verify
      - name: Upload Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage1-native-windows-warp
          path: ${{ runner.temp }}/stage1-${{ github.job }}
          if-no-files-found: warn

  stage1-native-linux-x11-lavapipe:
    name: stage1-native-linux-x11-lavapipe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GPUI_RENDERER: software
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Prepare evidence directory
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          mkdir -p "$artifact_dir"
          {
            rustc -vV
            cargo -V
            rustup show active-toolchain
            uname -a
          } > "$artifact_dir/target-metadata.log"
      - name: Record exact source identity
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: record
      - name: Install native runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          script/bootstrap
          sudo apt-get install --yes \
            mesa-vulkan-drivers \
            vulkan-tools \
            x11-utils \
            xclip \
            xvfb
      - name: Run focused input and accessibility contracts
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          python3 tooling/stage1_watchdog.py \
            --timeout-seconds 600 \
            --stdout "$artifact_dir/focused-contracts.stdout.log" \
            --stderr "$artifact_dir/focused-contracts.stderr.log" \
            --log "$artifact_dir/focused-contracts.watchdog.log" \
            -- cargo test --locked -p gpui-component stage1_contract_
      - name: Build native conformance runner
        run: cargo build --locked -p gpui-component-conformance
      - name: Run and validate native scenarios
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          export DISPLAY=:99
          unset WAYLAND_DISPLAY
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -type f \( -name 'lvp_icd.json' -o -name 'lvp_icd.*.json' \) -print -quit)"
          test -n "$lavapipe_icd"
          printf '%s\n' "$lavapipe_icd" > "$artifact_dir/lavapipe-icd.path"
          export VK_ICD_FILENAMES="$lavapipe_icd"

          export GPUI_STAGE1_ARTIFACT_DIR="$artifact_dir"
          export GPUI_STAGE1_BINARY="target/debug/gpui-component-conformance"
          export GPUI_STAGE1_VALIDATION_PROFILE="linux-x11-lavapipe"
          python3 tooling/stage1_service_harness.py \
            --timeout-seconds 900 \
            --service-executable Xvfb \
            --service-argument "$DISPLAY" \
            --service-argument=-screen \
            --service-argument=0 \
            --service-argument=1280x1024x24 \
            --service-stdout "$artifact_dir/xvfb.stdout.log" \
            --service-stderr "$artifact_dir/xvfb.log" \
            --payload-stdout "$artifact_dir/x11-session.stdout.log" \
            --payload-stderr "$artifact_dir/x11-session.stderr.log" \
            --log "$artifact_dir/x11-session.supervisor.log" \
            -- bash tooling/stage1_x11_session.sh
      - name: Verify exact source identity
        if: always()
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: verify
      - name: Upload Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage1-native-linux-x11-lavapipe
          path: ${{ runner.temp }}/stage1-${{ github.job }}
          if-no-files-found: warn

  stage1-native-linux-wayland-lavapipe:
    name: stage1-native-linux-wayland-lavapipe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GPUI_RENDERER: software
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Prepare evidence directory
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          mkdir -p "$artifact_dir"
          {
            rustc -vV
            cargo -V
            rustup show active-toolchain
            uname -a
          } > "$artifact_dir/target-metadata.log"
      - name: Record exact source identity
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: record
      - name: Install native runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          script/bootstrap
          sudo apt-get install --yes \
            hwdata \
            libcairo2-dev \
            libdrm-dev \
            libevdev-dev \
            libinput-dev \
            libpixman-1-dev \
            libudev-dev \
            mesa-vulkan-drivers \
            meson \
            ninja-build \
            pkg-config \
            vulkan-tools \
            wayland-utils
      - name: Run focused input and accessibility contracts
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          python3 tooling/stage1_watchdog.py \
            --timeout-seconds 600 \
            --stdout "$artifact_dir/focused-contracts.stdout.log" \
            --stderr "$artifact_dir/focused-contracts.stderr.log" \
            --log "$artifact_dir/focused-contracts.watchdog.log" \
            -- cargo test --locked -p gpui-component stage1_contract_
      - name: Build native conformance runner
        run: cargo build --locked -p gpui-component-conformance --features wayland-conformance
      - name: Build pinned Weston Wayland fixture
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          protocols_tarball="$RUNNER_TEMP/wayland-protocols-1.46.tar.xz"
          protocols_source="$RUNNER_TEMP/wayland-protocols-1.46"
          protocols_build="$RUNNER_TEMP/wayland-protocols-build"
          protocols_prefix="$RUNNER_TEMP/wayland-protocols-prefix"
          tarball="$RUNNER_TEMP/weston-16.0.0.tar.xz"
          source_parent="$RUNNER_TEMP/weston-source"
          build_dir="$RUNNER_TEMP/weston-build"
          curl --fail --location --silent --show-error \
            https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.46/downloads/wayland-protocols-1.46.tar.xz \
            --output "$protocols_tarball"
          printf '%s  %s\n' \
            fd0de056a895fa48bd1aa5f0b8dfeed454101b88bc7e1c61a953422eb71db167 \
            "$protocols_tarball" > "$artifact_dir/wayland-protocols.sha256"
          sha256sum --check "$artifact_dir/wayland-protocols.sha256"
          tar --extract --xz --file "$protocols_tarball" --directory "$RUNNER_TEMP"
          meson setup "$protocols_build" "$protocols_source" \
            --prefix "$protocols_prefix" \
            -Dtests=false
          meson install -C "$protocols_build"
          export PKG_CONFIG_PATH="$protocols_prefix/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"

          curl --fail --location --silent --show-error \
            https://gitlab.freedesktop.org/wayland/weston/-/releases/16.0.0/downloads/weston-16.0.0.tar.xz \
            --output "$tarball"
          source_dir="$(python3 tooling/prepare_weston_wayland_fixture.py \
            --tarball "$tarball" \
            --source-parent "$source_parent" \
            --fixture tooling/weston_gpui_wayland_input_test.c \
            --reader tooling/weston_gpui_wayland_clipboard_reader.c \
            --metadata "$artifact_dir/weston-fixture.json")"
          meson setup "$build_dir" "$source_dir" \
            -Dbackend-default=headless \
            -Dbackend-drm=false \
            -Dbackend-headless=true \
            -Dbackend-pipewire=false \
            -Dbackend-rdp=false \
            -Dbackend-vnc=false \
            -Dbackend-wayland=false \
            -Dbackend-x11=false \
            -Dcolor-management-lcms=false \
            -Ddemo-clients=false \
            -Dimage-jpeg=false \
            -Dimage-webp=false \
            -Drenderer-gl=false \
            -Drenderer-vulkan=false \
            -Dshell-desktop=true \
            -Dshell-ivi=false \
            -Dshell-kiosk=false \
            -Dshell-lua=false \
            -Dsimple-clients=[] \
            -Dsystemd=false \
            -Dtest-junit-xml=false \
            -Dtests=true \
            -Dtools=[] \
            -Dxwayland=false
          meson compile -C "$build_dir" \
            weston \
            headless-backend \
            desktop-shell \
            weston-desktop-shell \
            weston-keyboard \
            test-plugin \
            weston-test-desktop-shell \
            test-gpui-wayland-input \
            gpui-wayland-clipboard-reader
          {
            echo "GPUI_WESTON_BUILD_DIR=$build_dir"
            echo "GPUI_WESTON_BINARY=$build_dir/frontend/weston"
            echo "GPUI_WESTON_FIXTURE=$build_dir/tests/test-gpui-wayland-input"
            echo "GPUI_WESTON_CLIPBOARD_READER=$build_dir/tests/gpui-wayland-clipboard-reader"
          } >> "$GITHUB_ENV"
      - name: Run and validate native scenarios
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/stage1-${{ github.job }}"
          XDG_RUNTIME_DIR="$(mktemp -d "$RUNNER_TEMP/stage1-wayland-runtime.XXXXXX")"
          export XDG_RUNTIME_DIR
          chmod 700 "$XDG_RUNTIME_DIR"
          unset DISPLAY
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -type f \( -name 'lvp_icd.json' -o -name 'lvp_icd.*.json' \) -print -quit)"
          test -n "$lavapipe_icd"
          printf '%s\n' "$lavapipe_icd" > "$artifact_dir/lavapipe-icd.path"
          export VK_ICD_FILENAMES="$lavapipe_icd"
          binary="$GITHUB_WORKSPACE/target/debug/gpui-component-conformance"
          validation_profile="linux-wayland-lavapipe"
          normal_socket="stage1-wayland-normal"
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}"
          eval "$(meson devenv -C "$GPUI_WESTON_BUILD_DIR" --dump)"
          export WAYLAND_DISPLAY="$normal_socket"
          export GPUI_STAGE1_ARTIFACT_DIR="$artifact_dir"
          export GPUI_STAGE1_BINARY="$binary"
          export GPUI_STAGE1_VALIDATION_PROFILE="$validation_profile"
          python3 tooling/stage1_service_harness.py \
            --timeout-seconds 900 \
            --service-executable "$GPUI_WESTON_BINARY" \
            --service-argument=--backend=headless-backend.so \
            --service-argument=--renderer=pixman \
            --service-argument=--fake-seat \
            --service-argument=--idle-time=0 \
            --service-argument="--socket=$normal_socket" \
            --service-stdout "$artifact_dir/weston-normal.stdout.log" \
            --service-stderr "$artifact_dir/weston-normal.log" \
            --payload-stdout "$artifact_dir/wayland-normal-session.stdout.log" \
            --payload-stderr "$artifact_dir/wayland-normal-session.stderr.log" \
            --log "$artifact_dir/wayland-normal-session.supervisor.log" \
            -- bash tooling/stage1_wayland_normal_session.sh
          unset WAYLAND_DISPLAY
          export GPUI_STAGE1_REPO_ROOT="$GITHUB_WORKSPACE"
          export GPUI_STAGE1_ARTIFACT_DIR="$artifact_dir"
          export GPUI_STAGE1_BINARY="$binary"
          export GPUI_STAGE1_WAYLAND_CLIPBOARD_SESSION="$GITHUB_WORKSPACE/tooling/stage1_wayland_session.sh"
          export GPUI_STAGE1_WAYLAND_CLIPBOARD_READER="$GPUI_WESTON_CLIPBOARD_READER"
          python3 tooling/stage1_watchdog.py \
            --timeout-seconds 900 \
            --stdout "$artifact_dir/weston-fixture.tap.log" \
            --stderr "$artifact_dir/weston-fixture.stderr.log" \
            --log "$artifact_dir/weston-fixture.watchdog.log" \
            -- "$GPUI_WESTON_FIXTURE"
      - name: Verify exact source identity
        if: always()
        uses: ./.github/actions/stage1-source-identity
        with:
          artifact-dir: ${{ runner.temp }}/stage1-${{ github.job }}
          mode: verify
      - name: Upload Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage1-native-linux-wayland-lavapipe
          path: ${{ runner.temp }}/stage1-${{ github.job }}
          if-no-files-found: warn
