[package]
name = "gpui-component-assets"
description = "Default bundled assets for GPUI Component."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-component"
homepage = "https://BumpyClock.github.io/gpui-component"
repository = "https://github.com/BumpyClock/gpui-component"
readme = "README.md"
edition.workspace = true
publish = true
version = "0.7.0"
rust-version = "1.95.0"

[dependencies]
anyhow.workspace = true
gpui.workspace = true
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path"] }

[dev-dependencies]
gpui_platform.workspace = true
