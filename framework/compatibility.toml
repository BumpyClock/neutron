schema = 1

[framework]
name = "neutron-components"
version = "0.7.0"
repository = "https://github.com/BumpyClock/neutron"
rust_msrv = "1.90"
pinned_toolchain = "1.95.0"
audit_toolchain = "1.95.0"
previous_release = "0.6.0"
previous_release_gpui_rev = "2a03ae6e789b77e98f9d9bd5489758a082313c75"

[gpui]
engine_path = "engine"
zed_repository = "https://github.com/zed-industries/zed"
zed_upstream_base = "d9ad6aff67e47de43abb270d22de75dd950f1b48"

[[gpui.packages]]
dependency = "gpui"
registry_package = "bumpyclock-gpui"
version = "0.1.0"
crate_path = "crates/gpui"
public_api = true
features = ["font-kit"]
registry_status = "selected-unpublished"
registry_note = "bumpyclock-gpui 0.1.0 is the owner-selected facade identity but is not reserved or published on crates.io"

[[gpui.packages]]
dependency = "gpui_platform"
registry_package = "gpui_platform"
version = "0.1.0"
crate_path = "crates/gpui_platform"
public_api = true
features = ["font-kit"]
registry_status = "unavailable"
registry_note = "no owner-authorized BumpyClock/gpui publication identity is established"

[[gpui.packages]]
dependency = "gpui-macros"
registry_package = "gpui_macros"
version = "0.1.0"
crate_path = "crates/gpui_macros"
public_api = true
features = []
registry_status = "conflict"
registry_note = "gpui-macros 0.1.0 exists on crates.io but is an external, source-conflicting identity; latest is 0.2.2"

[[gpui.packages]]
dependency = "sum-tree"
registry_package = "sum_tree"
version = "0.1.0"
crate_path = "crates/sum_tree"
public_api = true
features = []
registry_status = "unavailable"
registry_note = "sum_tree 0.1.0 has no owner-authorized crates.io identity; zed-sum-tree 0.2.0 is a different engine source"

[release]
crates_io_ready = false
blockers = [
    "owner must approve remaining crates.io identities for BumpyClock/gpui packages",
    "owner must approve the new Neutron Components crates.io identities",
    "BumpyClock control of historical Longbridge crates.io identities is unverified",
    "exact engine versions must be published before framework packages",
    "neutron-components-app remains private because fix-path-env is a Git-only normal dependency with no registry release",
    "GPUI root patches for async-task, calloop, and windows-capture are not inherited by Git consumers or packaged manifests",
    "Lucide-derived bundled icon source, version, license, and notice require owner review before framework publication",
]

[[platforms]]
name = "macOS"
target = "aarch64-apple-darwin"
build = "verified"
unit = "not-verified"
headless = "verified"
native_runtime = "verified"
renderer = "verified"
package = "not-verified"
maturity = "preview"
notes = "The locked workspace compile/lint matrix covers this target; a full macOS unit suite is not retained. Retained exact-source Stage 1 evidence passed the macOS headless lifecycle and native macOS Metal profiles in GitHub Actions. Native validation recorded AppKit handles, the default hardware Metal adapter, backend-accepted presentation, interaction contracts, and the external pbpaste clipboard handshake. This does not prove display scanout, physical input, production IME, OS DPI transitions, assistive-technology activation, or screen-reader behavior."

[[platforms]]
name = "Windows"
target = "x86_64-pc-windows-msvc"
build = "verified"
unit = "not-verified"
headless = "verified"
native_runtime = "verified"
renderer = "verified"
package = "not-verified"
maturity = "experimental"
notes = "The locked workspace compile/lint matrix covers this target; a full Windows unit suite is not retained. Retained exact-source Stage 1 evidence passed the Windows headless lifecycle and native Windows WARP profiles in GitHub Actions. Native validation recorded Win32 handles, a software D3D11 WARP or Microsoft Basic Render adapter, backend-accepted presentation, interaction contracts, and the external PowerShell clipboard handshake. This does not prove hardware-GPU execution, display scanout, physical input, production IME, OS DPI transitions, assistive-technology activation, or screen-reader behavior. WM_QUERYENDSESSION and WM_ENDSESSION remain unsupported."

[[platforms]]
name = "Linux X11"
target = "x86_64-unknown-linux-gnu"
build = "verified"
unit = "verified"
headless = "verified"
native_runtime = "verified"
renderer = "verified"
package = "not-verified"
maturity = "experimental"
notes = "The locked workspace compile/lint matrix and unit suite cover this target. Retained exact-source Stage 1 evidence passed the Linux headless lifecycle and native X11 Xvfb/lavapipe profiles in GitHub Actions. Native validation recorded XCB handles, a software lavapipe or llvmpipe Vulkan adapter, API-submitted presentation, interaction contracts, and the external xclip clipboard handshake. API submission does not prove backend acceptance, display scanout, hardware-GPU execution, physical input, production IME, OS DPI transitions, assistive-technology activation, or screen-reader behavior."

[[platforms]]
name = "Linux Wayland"
target = "x86_64-unknown-linux-gnu"
build = "verified"
unit = "verified"
headless = "verified"
native_runtime = "verified"
renderer = "verified"
package = "not-verified"
maturity = "experimental"
notes = "The locked workspace compile/lint matrix and unit suite cover this target. Retained exact-source Stage 1 evidence passed the Linux headless lifecycle and native Wayland Weston/lavapipe profiles in GitHub Actions. Native validation recorded Wayland handles, a software lavapipe or llvmpipe Vulkan adapter, API-submitted presentation, interaction contracts, and the private-fixture external clipboard handshake. API submission does not prove backend acceptance, display scanout, hardware-GPU execution, physical input, arbitrary compositor support, production IME, OS DPI transitions, assistive-technology activation, or screen-reader behavior."
