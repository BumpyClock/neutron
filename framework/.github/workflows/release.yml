name: "Release Gate"
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read

jobs:
  release_gate:
    name: Validate registry release prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Show required publication order
        run: cargo xtask publish-plan --require-registry
      - name: Validate source, tests, and package artifacts
        run: cargo xtask release-check --require-registry
