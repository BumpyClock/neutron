name: Framework CI
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.90 package checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.90.0
      - name: Check engine-independent framework packages
        run: >-
          cargo check --locked
          -p neutron-components-macros
          -p neutron-components-manifest
          -p neutron-components-storage
          -p framework-xtask

  compile:
    name: Compile and lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            run_on: macos-latest
          - target: x86_64-linux-gnu
            run_on: ubuntu-latest
          - target: x86_64-windows-msvc
            run_on: windows-latest
    runs-on: ${{ matrix.run_on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
      - name: Install system dependencies
        if: ${{ matrix.run_on != 'windows-latest' }}
        run: script/bootstrap
      - name: Install Linux build dependencies
        if: ${{ matrix.run_on == 'ubuntu-latest' }}
        uses: ./.github/actions/install-linux-dependencies
      - name: Machete
        if: ${{ matrix.run_on == 'macos-latest' }}
        uses: bnjbvr/cargo-machete@7959c845782fed02ee69303126d4a12d64f1db18 # v0.9.1
      - name: Setup | Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: compile-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Typo check
        if: ${{ matrix.run_on == 'macos-latest' }}
        run: |
          # --locked for reproducibility; no `|| echo` mask — a failed install
          # must fail the step, not surface later as `typos: command not found`.
          which typos >/dev/null 2>&1 || cargo install typos-cli --locked
          typos framework
      - name: Lint (macOS)
        if: ${{ matrix.run_on == 'macos-latest' }}
        run: cargo clippy --locked --workspace --all-targets --all-features -- --deny warnings
      - name: Lint (Linux)
        if: ${{ matrix.run_on == 'ubuntu-latest' }}
        run: cargo clippy --locked --workspace --all-targets --all-features -- --deny warnings
      - name: Lint (Windows)
        if: ${{ matrix.run_on == 'windows-latest' }}
        run: cargo clippy --locked --workspace --all-targets --all-features -- --deny warnings

  unit-and-headless:
    name: Unit, doctest, and headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Install system dependencies
        run: script/bootstrap
      - uses: ./.github/actions/install-linux-dependencies
      - name: Run maintained unit and headless tests
        run: cargo test --workspace --all-targets --locked --features test-support
      - name: Run doctests
        run: cargo test --workspace --doc --locked
      - name: Run Stage 1 tooling tests
        run: |
          python3 -m unittest discover -s framework/tooling -p 'test_*.py'
          python3 -m unittest discover -s framework/tooling/tests -p 'test_*.py'

  compatibility-and-packaging:
    name: Compatibility and package manifests
    needs: unit-and-headless
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Install system dependencies
        run: script/bootstrap
      - uses: ./.github/actions/install-linux-dependencies
      - name: Show publication prerequisites
        run: cargo run --locked -p framework-xtask -- publish-plan
      - name: Validate compatibility and package artifacts
        run: cargo run --locked -p framework-xtask -- release-check

  # Ordinary-CI build and legacy smoke coverage for the app-platform examples.
  # This job does not retain protocol evidence and is not the cross-platform
  # native acceptance matrix. `.github/workflows/stage1.yml` owns native macOS,
  # Windows WARP, Linux X11/lavapipe, and Linux Wayland/lavapipe execution,
  # validation, exact-source manifests, and artifacts. Keep this build matrix in
  # sync with `compile`; keep runtime claims in Stage 1 only.
  native-launch-smoke:
    name: Native launch smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            run_on: macos-latest
          - target: x86_64-linux-gnu
            run_on: ubuntu-latest
          - target: x86_64-windows-msvc
            run_on: windows-latest
    runs-on: ${{ matrix.run_on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Install system dependencies
        if: ${{ matrix.run_on != 'windows-latest' }}
        run: script/bootstrap
      - name: Install Linux build dependencies
        if: ${{ matrix.run_on == 'ubuntu-latest' }}
        uses: ./.github/actions/install-linux-dependencies
      # Build on every OS: this exercises the full D4 identity chain (build.rs +
      # include_identity!) cross-platform, even where we do not launch a
      # GPU-backed window below. `neutron-story` is the real gallery
      # application declaration, so its identity chain and CLI contract are
      # regression-checked here too.
      - name: Build conformance examples and the gallery application
        run: cargo build --locked -p app_shell -p app_shell_background -p neutron-story
      # Bounded, no-window CLI regression checks for the gallery binary.
      # `stage1_watchdog.py` is used only as a portable bounded process runner:
      # these steps open no window, retain no Stage 1 evidence, and never set
      # GPUI_STAGE1_STORY_EVIDENCE_PATH.
      #
      # `--help` and `--version` return from the pure launch parser before any
      # platform or GPUI object exists, so they are meaningful on every target.
      - name: Story pre-platform CLI contract (macOS and Linux)
        if: ${{ matrix.run_on != 'windows-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/story-cli"
          mkdir -p "$log_dir"
          story="target/debug/neutron-story"

          bounded() {
            local name="$1"
            local expected_exit_code="$2"
            shift 2
            python3 framework/tooling/stage1_watchdog.py \
              --timeout-seconds 120 \
              --expected-exit-code "$expected_exit_code" \
              --stdout "$log_dir/$name.stdout.log" \
              --stderr "$log_dir/$name.stderr.log" \
              --log "$log_dir/$name.watchdog.log" \
              -- "$@"
          }

          bounded help 0 "$story" --help
          grep -Fq -- '--asset-smoke' "$log_dir/help.stdout.log"
          bounded version 0 "$story" --version
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' "$log_dir/version.stdout.log"
      # `--asset-smoke` and `--fail-start` construct the platform and GPUI, so
      # they need a platform backend the default feature graph actually builds.
      # The workspace pins `gpui_platform` with `default-features = false`, so
      # the Linux build carries neither the `x11` nor the `wayland` feature and
      # `try_current_platform` refuses to construct a windowed backend. Linux
      # story runtime therefore belongs to Stage 1, which selects the backend
      # features and owns its compositor, renderer, and retained evidence.
      # Do not reintroduce Xvfb or a software-renderer claim here: no display
      # server makes a backend the build never compiled appear.
      - name: Story platform CLI contract (macOS)
        if: ${{ matrix.run_on == 'macos-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/story-cli"
          mkdir -p "$log_dir"
          story="target/debug/neutron-story"

          bounded() {
            local name="$1"
            local expected_exit_code="$2"
            shift 2
            python3 framework/tooling/stage1_watchdog.py \
              --timeout-seconds 120 \
              --expected-exit-code "$expected_exit_code" \
              --stdout "$log_dir/$name.stdout.log" \
              --stderr "$log_dir/$name.stderr.log" \
              --log "$log_dir/$name.watchdog.log" \
              -- "$@"
          }

          bounded asset-smoke 0 "$story" --asset-smoke
          bounded fail-start 2 "$story" --fail-start
          grep -Fq NEUTRON_STORY_FAIL_START_REACHED "$log_dir/fail-start.stderr.log"
      # Windows keeps the platform-constructing modes. `gpui_windows` is a plain
      # `cfg(target_os = "windows")` dependency of `gpui_platform` with no
      # feature gate, so `try_current_platform` builds `WindowsPlatform` in the
      # default graph, and the `app_shell` startup-failure step below reaches
      # its in-startup marker on this runner — which only happens after the
      # platform and GPUI are constructed. Windowed Windows story runs still
      # belong to Stage 1's WARP job.
      - name: Story CLI contract (Windows)
        if: ${{ matrix.run_on == 'windows-latest' }}
        shell: pwsh
        run: |
          $logDir = Join-Path $env:RUNNER_TEMP "story-cli"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $story = "target\debug\neutron-story.exe"

          function Invoke-StoryCli([string]$Name, [int]$ExpectedExitCode, [string[]]$StoryArguments) {
            & python framework/tooling/stage1_watchdog.py `
              --timeout-seconds 120 `
              --expected-exit-code $ExpectedExitCode `
              --stdout (Join-Path $logDir "$Name.stdout.log") `
              --stderr (Join-Path $logDir "$Name.stderr.log") `
              --log (Join-Path $logDir "$Name.watchdog.log") `
              -- $story @StoryArguments
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          Invoke-StoryCli "help" 0 @("--help")
          if (-not (Get-Content (Join-Path $logDir "help.stdout.log") -Raw).Contains("--asset-smoke")) {
            Write-Output "story --help did not document the smoke modes"
            exit 1
          }
          Invoke-StoryCli "version" 0 @("--version")
          if (-not ((Get-Content (Join-Path $logDir "version.stdout.log") -Raw) -match '^\d+\.\d+\.\d+')) {
            Write-Output "story --version did not print a version"
            exit 1
          }
          Invoke-StoryCli "asset-smoke" 0 @("--asset-smoke")
          Invoke-StoryCli "fail-start" 2 @("--fail-start")
          if (-not (Get-Content (Join-Path $logDir "fail-start.stderr.log") -Raw).Contains("NEUTRON_STORY_FAIL_START_REACHED")) {
            Write-Output "story transactional start callback marker was not emitted"
            exit 1
          }
          exit 0
      # Retain the established macOS example smoke as a fast ordinary-CI
      # regression. Linux and Windows example binaries are compiled here, while
      # their configured native runtime coverage belongs to Stage 1's dedicated
      # lavapipe and WARP jobs. Do not infer Stage 1 evidence from this step.
      - name: Native launch smoke (macOS)
        if: ${{ matrix.run_on == 'macos-latest' }}
        run: |
          cargo run --locked -p app_shell -- --asset-smoke
          cargo run --locked -p app_shell -- --smoke
          cargo run --locked -p app_shell_background -- --smoke
      # A windowed gallery smoke, bounded and evidence-free. macOS is the only
      # ordinary-CI target with a display backend; Linux and Windows windowed
      # story runs belong to Stage 1's native jobs, which own their compositor,
      # renderer, and retained evidence.
      - name: Story window smoke (macOS)
        if: ${{ matrix.run_on == 'macos-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/story-cli"
          mkdir -p "$log_dir"
          python3 framework/tooling/stage1_watchdog.py \
            --timeout-seconds 120 \
            --stdout "$log_dir/smoke.stdout.log" \
            --stderr "$log_dir/smoke.stderr.log" \
            --log "$log_dir/smoke.watchdog.log" \
            -- target/debug/neutron-story --smoke
      # This ordinary-CI regression opens no window and checks the legacy example
      # exit contract. Stage 1 separately validates the protocol startup-failure
      # scenario on every maintained native profile.
      - name: Transactional startup failure smoke (macOS)
        if: ${{ matrix.run_on == 'macos-latest' }}
        shell: bash
        run: |
          set +e
          output="$(cargo run --locked -p app_shell -- --fail-start 2>&1)"
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$exit_code" -ne 2 ]; then
            echo "expected transactional startup failure to exit 2, got $exit_code"
            exit 1
          fi
          grep -Fq APP_SHELL_FAIL_START_REACHED <<<"$output"
      - name: Transactional startup failure smoke (Windows)
        if: ${{ matrix.run_on == 'windows-latest' }}
        shell: pwsh
        run: |
          # This step expects the binary to fail, so cargo exits non-zero and
          # writes to stderr. Both trip pwsh: a native command's stderr through
          # a 2>&1 pipeline can raise a terminating NativeCommandError, and the
          # runner appends `exit $LASTEXITCODE`, which would propagate cargo's
          # exit 2 as a step failure even when the assertions pass.
          #
          # So: redirect all streams to a file rather than piping, suppress
          # native-error promotion, and exit explicitly.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo run --locked -p app_shell -- --fail-start *> app_shell_fail_start.log
          $exitCode = $LASTEXITCODE
          $output = Get-Content app_shell_fail_start.log -Raw
          Write-Output $output
          if ($exitCode -ne 2) {
            Write-Output "expected transactional startup failure to exit 2, got $exitCode"
            exit 1
          }
          if (-not $output.Contains("APP_SHELL_FAIL_START_REACHED")) {
            Write-Output "transactional start callback marker was not emitted"
            exit 1
          }
          exit 0
