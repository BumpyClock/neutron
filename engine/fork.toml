schema-version = 1
upstream-repository = "https://github.com/zed-industries/zed"
upstream-base-commit = "2c4e44704c37ee87e59ac84e3e17388178b28545"
last-synchronization-date = "2026-07-09"
fork-repository = "https://github.com/BumpyClock/gpui"

# This is a selective semantic sync, not a contiguous merge. Keep entries at
# the maintained-area level so future syncs have a small, reviewable ledger.
[[patch-clusters]]
id = "standalone-foundation"
area = "workspace and dependency extraction"
status = "fork-only"
reason = "The fork is a standalone GPUI workspace rather than the Zed application workspace."

[[patch-clusters]]
id = "overlay-and-blur"
area = "overlay surfaces and blur rendering"
status = "fork-only"
reason = "Overlay surface, retained-layer, and backdrop-blur contracts are maintained by this fork."

[[patch-clusters]]
id = "accessibility-contracts"
area = "accessibility and semantic input"
status = "fork-only"
reason = "Stable IDs, rollback, and listener ownership are fork contracts that must survive syncs."

[[patch-clusters]]
id = "platform-adaptations"
area = "Linux, macOS, Windows, and web backends"
status = "temporary"
reason = "Backend adaptations are reconciled selectively and require platform-session validation."

[[patch-clusters]]
id = "scheduler-contracts"
area = "task scheduling and lifecycle"
status = "fork-only"
reason = "Fork panic and Send-only output behavior are deliberate standalone contracts."

# Registry identities are intentionally not claimed by this repository. These
# entries make the package map auditable. `selected-unpublished` records the
# owner's selected facade name without claiming a crates.io reservation;
# `provisional` remains a candidate only, never a reservation.
[[registry-packages]]
workspace = "gpui"
package = "bumpyclock-gpui"
registry = "bumpyclock-gpui"
version = "0.1.0"
status = "selected-unpublished"

[[registry-packages]]
workspace = "gpui_macros"
registry = "gpui_macros"
version = "0.1.0"
