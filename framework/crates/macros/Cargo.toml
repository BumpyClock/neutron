[package]
name = "gpui-component-macros"
description = "Macros for GPUI Component."
version = "0.7.0"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/BumpyClock/gpui-component"
documentation = "https://docs.rs/gpui-component-macros"
homepage = "https://BumpyClock.github.io/gpui-component"
readme = "README.md"
publish = true
edition.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"

[package.metadata.cargo-machete]
ignored = ["proc-macro2", "core-text"]
