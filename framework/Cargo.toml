[workspace]
default-members = ["crates/ui", "crates/story", "crates/assets"]
members = [
    "crates/app",
    "crates/app-manifest",
    "crates/app-storage",
    "crates/macros",
    "crates/story",
    "crates/ui",
    "crates/assets",
    "crates/reqwest_client",
    "crates/webview",
    "conformance/app",
    "examples/app_assets",
    "examples/app_shell",
    "examples/app_shell_background",
    "examples/hello_world",
    "examples/input",
    "examples/window_title",
    "examples/dialog_overlay",
    "examples/webview",
    "examples/system_monitor",
    "examples/focus_trap",
    "xtask",
]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"
version = "0.7.0"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/BumpyClock/gpui-component"

[workspace.dependencies]
gpui-component = { path = "crates/ui", version = "=0.7.0" }
gpui-component-app = { path = "crates/app", version = "=0.7.0" }
gpui-component-manifest = { path = "crates/app-manifest", version = "=0.7.0" }
gpui-component-storage = { path = "crates/app-storage", version = "=0.7.0" }
gpui-component-macros = { path = "crates/macros", version = "=0.7.0" }
gpui-component-assets = { path = "crates/assets", version = "=0.7.0" }
story = { path = "crates/story" }

gpui = { package = "bumpyclock-gpui", version = "=0.1.0", git = "https://github.com/BumpyClock/gpui", rev = "198635ca8435c38dd4dfe796089145cdbefae36c", features = ["font-kit"] }
gpui_platform = { version = "=0.1.0", git = "https://github.com/BumpyClock/gpui", rev = "198635ca8435c38dd4dfe796089145cdbefae36c", features = ["font-kit"] }
gpui-macros = { package = "gpui_macros", version = "=0.1.0", git = "https://github.com/BumpyClock/gpui", rev = "198635ca8435c38dd4dfe796089145cdbefae36c" }
sum-tree = { package = "sum_tree", version = "=0.1.0", git = "https://github.com/BumpyClock/gpui", rev = "198635ca8435c38dd4dfe796089145cdbefae36c" }
# reqwest = { version = "0.12.15-zed", package = "zed-reqwest" }
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
], package = "zed-reqwest", version = "0.12.15-zed" }

anyhow = "1"
backtrace = "0.3"
bitflags = "2.6.0"
circular-buffer = "1.0"
chrono = { version = "0.4", features = ["serde"] }
ctor = "0.4.0"
derive_more = "0.99.17"
dirs = "6"
env_logger = "0.11"
# Login-shell PATH repair for GUI-launched apps (EnvironmentPolicy::LoginShell).
# Git-only crate (no crates.io release); pinned to the same rev agent-term uses.
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
futures = "0.3"
image = "0.25.1"
inventory = "0.3.19"
itertools = "0.14.0"
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "8.2.0"
parking_lot = "0.12.1"
postage = { version = "0.5", features = ["futures-traits"] }
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
profiling = "1"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "3"
rand = "0.9"
schemars = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1"
slotmap = "1.0.6"
smallvec = "1.15.1"
smol = "2"
stacksafe = "0.1"
strum = { version = "0.27.2", features = ["derive"] }
tempfile = "3"
thiserror = "2.0.12"
toml = "0.9"
tracing = "0.1.44"
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
wait-timeout = "0.2.1"
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed" }

[workspace.dependencies.windows]
features = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_UI",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
version = "0.62.2"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
redundant_clone = "deny"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[workspace.metadata.typos]
files.extend-exclude = ["**/fixtures/*"]

[workspace.metadata.typos.default.extend-identifiers]
consts = "consts"
