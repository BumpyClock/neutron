name: Install Linux dependencies
description: Install native libraries required for root workspace validation

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc \
          g++ \
          clang \
          pkg-config \
          ripgrep \
          libfontconfig-dev \
          libfreetype-dev \
          libglib2.0-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          mesa-vulkan-drivers \
          libvulkan1 \
          libvulkan-dev \
          libzstd-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxcb-randr0-dev \
          libxcb-xinput-dev \
          libxcb-cursor-dev \
          libxcb-sync-dev \
          libxcb-render0-dev \
          libxcb-present-dev \
          vulkan-validationlayers \
          xauth \
          xvfb
